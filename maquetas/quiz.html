<title>Quiz La Burbuja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Maqueta móvil de una sola columna: barra de demo arriba, pantallas del pasaporte debajo. Estilo único noche/oro del pasaporte. */
:root{
  --noche:#0b0a09; --noche2:#16130f; --oro:#c7a84d; --oro-claro:#f6e7b0; --oro-sombra:#7d5f17;
  --marfil:#fffdf8; --tinta:#1d1606; --gris:#a59a83; --linea:#3a3122; --rojo:#c0392b; --verde:#3f9b5b;
  --f-disp:'Oswald','Arial Narrow',Impact,sans-serif; --f-txt:'Inter',system-ui,-apple-system,sans-serif;
  --foil:linear-gradient(160deg,#7d5f17 0%,#c7a84d 18%,#f6e7b0 38%,#d9bd68 52%,#b38f32 70%,#e9d18a 86%,#8a6a1f 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--noche);color:var(--oro-claro);font-family:var(--f-txt);font-size:15px;line-height:1.45;
  background-image:radial-gradient(120% 50% at 50% -5%,rgba(199,168,77,.28),transparent 60%);background-attachment:fixed;min-height:100%}
.wrap{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
/* barra de demo */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#1a1610;border-bottom:1px solid var(--linea);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#1a1610}
.demo .in{max-width:440px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.demo b{font:600 10px/1 var(--f-txt);letter-spacing:.12em;color:var(--gris);text-transform:uppercase;margin-right:2px}
.sw{display:inline-flex;border:1px solid var(--linea);border-radius:999px;overflow:hidden}
.sw button{background:none;border:0;color:var(--gris);font:600 11px var(--f-txt);padding:6px 10px;cursor:pointer}
.sw button.on{background:var(--oro);color:var(--tinta)}
.note{font-size:11px;color:var(--gris);width:100%;margin-top:2px}
/* cabecera */
.head{display:flex;align-items:center;gap:10px;padding-block:16px 10px}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--oro);background:none;color:var(--oro);font-size:18px;cursor:pointer;flex:none}
.head h1{font:700 26px/1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase;margin:0;
  background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.eyebrow{font:600 11px/1 var(--f-txt);letter-spacing:.16em;text-transform:uppercase;color:var(--oro)}
h2{font:600 17px/1.2 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--oro);margin:22px 0 10px}
/* botones */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font:700 17px/1 var(--f-disp);letter-spacing:.07em;text-transform:uppercase;
  cursor:pointer;position:relative;transition:transform .08s,box-shadow .08s;text-align:center}
.gold{background:var(--foil);color:var(--tinta);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 6px 0 var(--oro-sombra),0 10px 18px rgba(0,0,0,.55)}
.gold:active{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 1px 0 var(--oro-sombra),0 3px 6px rgba(0,0,0,.5)}
.ivory{background:var(--marfil);color:var(--tinta);box-shadow:inset 0 -2px 0 #e7dcc0,0 5px 0 #9c8547,0 8px 14px rgba(0,0,0,.5);border:1px solid var(--oro)}
.ivory:active{transform:translateY(4px);box-shadow:0 1px 0 #9c8547}
.ghost{background:transparent;color:var(--oro-claro);border:1.5px solid var(--oro);font-size:15px;padding:12px}
.btn[disabled]{filter:grayscale(.8) brightness(.6);cursor:not-allowed;transform:none}
.btn small{display:block;font:500 12px/1.3 var(--f-txt);letter-spacing:0;text-transform:none;margin-top:5px;opacity:.85}
.stack{display:grid;gap:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--oro-claro);outline-offset:3px}
/* tarjetas marfil */
.card{background:var(--marfil);color:var(--tinta);border-radius:16px;padding:16px;border:2px solid var(--oro);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.card h3{font:700 18px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.muted{color:#6d6250;font-size:13px}
.dark{background:var(--noche2);border:1px solid var(--linea);border-radius:14px;padding:14px}
/* portada */
.pass{aspect-ratio:3/4;max-width:100%;border-radius:18px;border:3px solid var(--oro);background:
  radial-gradient(70% 45% at 50% 30%,rgba(246,231,176,.22),transparent 70%),linear-gradient(170deg,#2a1d0d,#0b0a09 70%);
  display:grid;place-items:center;text-align:center;padding:24px;box-shadow:0 14px 34px rgba(0,0,0,.6);margin-top:14px}
.pass .t{font:700 44px/0.95 var(--f-disp);letter-spacing:.05em;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
.pass .s{font:600 12px var(--f-txt);letter-spacing:.3em;color:var(--oro);margin-top:10px}
.pass .num{margin-top:22px;border:1px dashed var(--oro);border-radius:10px;padding:8px 14px;font:600 13px var(--f-txt);color:var(--oro-claro)}
.quizBtn{margin-top:18px;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.12);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 6px 0 var(--oro-sombra),0 0 26px rgba(246,231,176,.55)}}
@media (prefers-reduced-motion:reduce){.quizBtn{animation:none}}
.live{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--f-txt);letter-spacing:.12em;color:#fff;background:var(--rojo);border-radius:999px;padding:4px 9px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
/* juegos */
.gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--marfil);color:var(--tinta);border:2px solid var(--oro);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;
  box-shadow:0 5px 0 #9c8547;font:700 15px var(--f-disp);text-transform:uppercase;letter-spacing:.04em;display:grid;gap:6px;justify-items:center}
.tile .ic{font-size:26px;line-height:1}
.tile.star{grid-column:1/-1;background:var(--foil);box-shadow:0 6px 0 var(--oro-sombra);font-size:20px}
.tile .tag{font:600 11px var(--f-txt);text-transform:none;letter-spacing:0}
/* fechas */
.dates{display:grid;gap:8px}
.date{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--noche2);border:1px solid var(--linea);border-radius:12px;padding:10px}
.cal{background:var(--marfil);color:var(--tinta);border-radius:8px;text-align:center;padding:4px 0;border-top:6px solid var(--rojo)}
.cal b{display:block;font:700 22px/1 var(--f-disp)}
.cal span{font:600 10px var(--f-txt);letter-spacing:.08em;text-transform:uppercase}
.date .tt{font-weight:600;color:var(--oro-claro)}
.date .st{font-size:12px;color:var(--gris)}
.chip{font:600 11px var(--f-txt);border-radius:999px;padding:4px 9px;white-space:nowrap}
.c-ok{background:rgba(63,155,91,.18);color:#8fd6a6;border:1px solid #3f9b5b}
.c-no{background:transparent;color:var(--oro);border:1px solid var(--oro)}
.c-full{background:rgba(192,57,43,.2);color:#f0a59b;border:1px solid var(--rojo)}
/* liga */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:600 10px var(--f-txt);letter-spacing:.1em;text-transform:uppercase;color:#6d6250;text-align:left;padding:4px 4px 8px}
.tbl td{padding:8px 4px;border-top:1px solid #eadfc4;vertical-align:middle}
.tbl td.n{text-align:right;font-weight:700}
.tbl tr.me td{background:#1d1606;color:var(--oro-claro)}
.tbl tr.me td:first-child{border-radius:8px 0 0 8px}.tbl tr.me td:last-child{border-radius:0 8px 8px 0}
.pos{font:700 18px var(--f-disp);width:26px;text-align:center}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.trend{font-size:11px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:6px 0 16px}
.pod{text-align:center;display:grid;justify-items:center;gap:4px}
.pod .blk{width:100%;border-radius:10px 10px 0 0;background:var(--foil);color:var(--tinta);font:700 22px var(--f-disp);display:grid;place-items:center}
.pod .nm{font:600 12px var(--f-txt);color:var(--oro-claro);line-height:1.2}
.pod .pt{font:600 11px var(--f-txt);color:var(--gris)}
/* equipo */
.team{display:flex;gap:14px;align-items:center}
.members{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mem{text-align:center;background:#f6efdc;border-radius:12px;padding:6px 4px 8px;position:relative}
.mem svg.cust{width:70px;height:auto;margin:0 auto;display:block}
.mem .nm{font:600 12px var(--f-txt)}
.mem .rl{font-size:10px;color:#6d6250}
.cap{position:absolute;top:4px;right:4px;background:var(--tinta);color:var(--oro-claro);font:700 9px var(--f-txt);border-radius:999px;padding:2px 6px}
.codebox{display:flex;gap:12px;align-items:center;background:var(--noche2);border:1px dashed var(--oro);border-radius:12px;padding:12px;margin-top:12px;color:var(--oro-claro)}
.code{font:700 26px var(--f-disp);letter-spacing:.2em}
.qr{width:74px;height:74px;flex:none;background:#fff;border-radius:6px;padding:4px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font:600 12px var(--f-txt);letter-spacing:.06em;text-transform:uppercase;color:var(--oro)}
.card .field label{color:#7d5f17}
input,select{font:500 16px var(--f-txt);padding:12px;border-radius:10px;border:1.5px solid var(--oro);background:#fff;color:var(--tinta);width:100%}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{width:42px;height:42px;border-radius:10px;border:2px solid #d9cba3;background:#fff;cursor:pointer;display:grid;place-items:center;font-size:20px;color:var(--tinta)}
.opt.on{border-color:var(--tinta);box-shadow:0 0 0 2px var(--oro)}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c9b98e;cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px var(--tinta)}
.preview{display:grid;place-items:center;padding:8px 0 4px}
/* directo */
.liveCard{background:linear-gradient(180deg,#22190b,#0f0c08);border:2px solid var(--oro);border-radius:18px;padding:18px;text-align:center}
.round{font:700 40px/1 var(--f-disp);color:var(--oro-claro);margin:10px 0 2px}
.bar{height:10px;border-radius:99px;background:#2b2418;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--foil);border-radius:99px}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--linea)}
.check svg.cust{width:42px;height:auto}
.check .who{flex:1;font-weight:600}
/* gestión */
.ownerHead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--marfil);color:var(--tinta);border-radius:12px;padding:10px;text-align:center;border:1.5px solid var(--oro)}
.stat b{display:block;font:700 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:#6d6250}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #eadfc4}
.row:first-of-type{border-top:0}
.ptsIn{width:78px;text-align:center;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--marfil);color:var(--tinta);
  border:2px solid var(--oro);border-radius:12px;padding:10px 16px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.6);z-index:30;max-width:calc(100% - 32px)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{display:grid;gap:8px}
.hist .dark{display:flex;justify-content:space-between;gap:10px;align-items:center}
.small{font-size:12px;color:var(--gris)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.slot{aspect-ratio:1;border-radius:50%;border:1.5px dashed #c9b98e;display:grid;place-items:center;font:600 12px var(--f-txt);color:#9c8547}.slot.on{border:0;background:var(--foil);color:var(--tinta);font:700 13px var(--f-disp);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.foot{margin-top:28px;font-size:12px;color:var(--gris);text-align:center}
</style>
<style>
.tabs{display:flex;border:1.5px solid var(--oro);border-radius:999px;overflow:hidden;margin-bottom:12px}
.tabs button{flex:1;background:none;border:0;color:var(--oro-claro);font:600 13px var(--f-txt);padding:9px;cursor:pointer}
.tabs button.on{background:var(--oro);color:var(--tinta)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.tgl .sw2{width:52px;height:30px;border-radius:99px;background:#d9cba3;position:relative;border:0;cursor:pointer;flex:none}
.tgl .sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:left .15s}
.tgl .sw2.on{background:var(--verde)}.tgl .sw2.on::after{left:25px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ans{aspect-ratio:1.4;border-radius:16px;border:0;font:700 40px var(--f-disp);color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.45)}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.ans[disabled]{opacity:.35;cursor:default;transform:none}
.ans.pick{opacity:1;outline:4px solid var(--oro-claro);outline-offset:3px}
.a0{background:#c0392b}.a1{background:#2f6fd6}.a2{background:#d4a017}.a3{background:#3f9b5b}
.timer{font:700 54px/1 var(--f-disp);color:var(--oro-claro);font-variant-numeric:tabular-nums}
.timer.low{color:#ff8a7a}
.warn{background:rgba(192,57,43,.18);border:1.5px solid var(--rojo);color:#ffc2b8;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.info{background:rgba(199,168,77,.12);border:1px solid var(--oro-sombra);color:var(--oro-claro);border-radius:12px;padding:10px 12px;font-size:13px}
.mem{cursor:pointer;border:2px solid transparent}
.mem.voted{border-color:var(--tinta)}
.badges{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:16px;margin-top:2px}
.bd{font:700 9px var(--f-txt);border-radius:999px;padding:2px 6px;letter-spacing:.04em}
.bd-cap{background:var(--tinta);color:var(--oro-claro)}
.bd-adm{background:#7d5f17;color:#fff}
.votes{font-size:10px;color:#6d6250;margin-top:2px}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:44px;text-align:center;font:700 22px var(--f-disp);padding:10px 0}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#4a4232;margin:10px 0}
.consent input{width:20px;height:20px;flex:none;margin-top:1px}
.qText{background:var(--marfil);color:var(--tinta);border-radius:12px;padding:12px;margin-top:8px}
.qText b{display:block;font:700 13px var(--f-disp);letter-spacing:.06em;color:#7d5f17;text-transform:uppercase}
.flagRow{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #eadfc4;font-size:14px}
.flagRow:first-of-type{border-top:0}
.card .c-ok{color:#1f6b38;background:#e3f3e8}.card .c-full{color:#a02b1f;background:#f8e1dd}
.scanBox{aspect-ratio:1;max-width:240px;margin:16px auto;border:3px solid var(--oro);border-radius:18px;display:grid;place-items:center;background:#fff;padding:18px}
.scanBox .qr{width:100%;height:auto;padding:0}
</style>

<div class="demo"><div class="in">
  <b>Maqueta</b>
  <span class="sw" id="swView"><button data-v="cli" class="on">Cliente</button><button data-v="own">Felipe</button></span>
  <span class="sw" id="swDay"><button data-v="1" class="on">Hoy hay quiz</button><button data-v="0">Sin quiz</button></span>
  <span class="sw" id="swUser"><button data-v="nuevo">Sin pasaporte</button><button data-v="libre">Sin equipo</button><button data-v="equipo" class="on">En equipo</button></span>
  <div class="note">Datos de ejemplo. Nada se guarda.</div>
</div></div>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== Muñecos de papel recortado: mismo código que MI AVATAR del pasaporte ===== */
function chDefault(){return{skin:'#e0ac69',hair:1,hairC:'#2b1d14',beard:0,glasses:0,hat:0,hatC:'#c0392b',shirt:'#2f6fd6',top:0,expr:0}}
function chColor(c,def){return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:def}
function chShade(h,p){return shade(chColor(h,'#888888'),p)}
function charSvgNew(sp,o){sp=sp||{};o=o||{};var d=chDefault();var S=chColor(sp.skin,d.skin),HC=chColor(sp.hairC,d.hairC),SH=chColor(sp.shirt,d.shirt),HT=chColor(sp.hatC,d.hatC),hv=+sp.hair||0,bd=+sp.beard||0,gl=+sp.glasses||0,ht=+sp.hat||0,tp=+sp.top||0,ex=+sp.expr||0;
 var K='#1b1410',sw=' stroke="'+K+'" stroke-width="1.4" stroke-linejoin="round"',SD=chShade(SH,-.28),PA='#2e3f63',ARM=tp===4?S:SH;
 var h='<svg viewBox="'+(o.crop?'6 0 68 66':'0 0 80 112')+'" class="cust ppr'+(o.cls?' '+o.cls:'')+'" aria-hidden="true">';
 /* pelo de detrás */
 if(hv===2)h+='<path d="M14 34 Q10 8 40 7 Q70 8 66 34 L70 76 Q40 84 10 76Z" fill="'+HC+'"'+sw+'/>';
 if(hv===7)h+='<path d="M14 34 Q11 8 40 7 Q69 8 66 34 L68 56 Q40 62 12 56Z" fill="'+HC+'"'+sw+'/>';
 if(hv===3)h+='<path d="M62 22 Q80 26 74 58 Q70 44 60 36Z" fill="'+HC+'"'+sw+'/>';
 /* piernas y pies */
 if(!o.noLegs)h+='<rect x="25" y="97" width="30" height="9" rx="2" fill="'+PA+'"'+sw+'/><ellipse cx="31" cy="107.5" rx="9" ry="4" fill="'+K+'"/><ellipse cx="49" cy="107.5" rx="9" ry="4" fill="'+K+'"/>';
 /* cuerpo */
 var body='M17 100 Q15 68 40 61 Q65 68 63 100Z';
 h+='<path d="'+body+'" fill="'+SH+'"'+sw+'/>';
 if(tp===1)h+='<path d="M32 62 L40 72 L48 62Z" fill="#f4f1e6"'+sw+'/><path d="M40 72 L40 99" stroke="'+K+'" stroke-width="1.1"/><circle cx="40" cy="80" r="1.3" fill="'+K+'"/><circle cx="40" cy="89" r="1.3" fill="'+K+'"/>';
 else if(tp===2)h+='<path d="M27 66 Q40 76 53 66" fill="none" stroke="'+SD+'" stroke-width="3"/><path d="M36 70 L35 80 M44 70 L45 80" stroke="#f4f1e6" stroke-width="1.4"/><path d="M28 92 Q40 96 52 92" fill="none" stroke="'+SD+'" stroke-width="2"/>';
 else if(tp===3){h+='<path d="M30 63 Q40 74 50 63" fill="none" stroke="'+SD+'" stroke-width="5"/><path d="M30 63 Q40 74 50 63" fill="none" stroke="'+chShade(SH,.2)+'" stroke-width="1.5" stroke-dasharray="1.6 1.6"/><path d="M17.3 95 L62.7 95" stroke="'+SD+'" stroke-width="4"/><path d="M17.3 95 L62.7 95" stroke="'+chShade(SH,.2)+'" stroke-width="4" stroke-dasharray="1.4 2.2"/>';[31,40,49].forEach(function(x){h+='<path d="M'+x+' 74 l-2.5 3.5 2.5 3.5 -2.5 3.5 2.5 3.5" fill="none" stroke="'+SD+'" stroke-width="1.3"/>'})}

     +(q.lost?'<div class="warn">Has salido del pasaporte durante la pregunta. Esta respuesta no puntúa y Felipe lo ve.</div>':'<div class="info" style="margin-top:12px">No salgas del pasaporte mientras haya una pregunta abierta: si lo haces, esa respuesta no puntúa.</div>')

var tick=null;
function render(){
  var sc=S.screen;
  if(S.view==='own'&&!/^g/.test(sc))sc=S.screen='gestion';
  if(S.view==='cli'&&/^g/.test(sc))sc=S.screen='portada';
  $('app').innerHTML=(V[sc]||V.portada)()+'<div class="foot">Maqueta del QUIZ para el Pasaporte La Burbuja · datos de ejemplo</div>';
  clearInterval(tick);
  if(sc==='directo'&&isCap()&&!S.q.ans&&S.q.left>0){tick=setInterval(function(){S.q.left--;var el=$('timer');if(S.q.left<=0){clearInterval(tick);render();return}if(el){el.textContent=S.q.left;el.classList.toggle('low',S.q.left<=5)}},1000)}
  var b=$('buscar');if(b)b.addEventListener('input',function(){var v=b.value.toLowerCase();[].forEach.call(document.querySelectorAll('#teamList [data-name]'),function(r){r.hidden=v&&r.dataset.name.indexOf(v)<0})});
}
function go(s){if(s==='__back'){S.screen=S.stack.pop()||'portada'}else{S.stack.push(S.screen);S.screen=s}S.tab=null;render();window.scrollTo(0,0)}
function jump(stack,screen){S.stack=stack;S.screen=screen;render();window.scrollTo(0,0)}
function setOn(id,v){[].forEach.call($(id).children,function(x){x.classList.toggle('on',x.dataset.v===v)})}
function setUser(u){S.user=u;S.myIdx=-1;S.newTeam=false;S.pend=-1;S.esc={shape:0,c1:'#c7a84d',c2:'#1d1606',ic:'★',name:'Los Sabelotodo'};resetTeamState();setOn('swUser',u)}
function sw(id,cb){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;setOn(id,b.dataset.v);cb(b.dataset.v);render();window.scrollTo(0,0)})}
sw('swView',function(v){S.view=v;S.stack=[];S.screen=v==='own'?'gestion':'portada'});
sw('swDay',function(v){S.day=v==='1';S.stack=[];S.screen='portada'});
sw('swUser',function(v){setUser(v);S.stack=[];S.screen=v==='nuevo'?'qr':'portada'});
/* Antitrampas: si el capitán sale del pasaporte con una pregunta abierta */
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S.screen==='directo'&&isCap()&&!S.q.ans&&S.q.left>0){S.q.out++;S.q.lost=true}
  if(!document.hidden&&S.screen==='directo'&&S.q.lost)render();
});
document.addEventListener('click',function(e){
  var tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();return}
  var el=e.target.closest('[data-go],[data-toast],[data-act],[data-esc],[data-ins]');if(!el)return;
  if(el.dataset.go)return go(el.dataset.go);
  if(el.dataset.toast)return toast(el.dataset.toast);
  if(el.dataset.ins){S.joined[el.dataset.ins]=true;render();return toast('Felipe ya sabe que vais')}
  if(el.dataset.esc){var k=el.dataset.esc,v=el.dataset.val;S.esc[k]=k==='shape'?+v:v;var nm=$('tName');if(nm)S.draftName=nm.value;if(nm&&myTeam()===MYT)S.esc.name=nm.value||S.esc.name;render();return}
  var a=el.dataset.act,n=el.dataset.n;
  if(a==='sendCode'){var m=$('mail').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m))return toast('Escribe un email válido');S.email=m;S.mkt=$('c2').checked;return go('codigo')}
  if(a==='verify'){S.user='libre';setOn('swUser','libre');jump([],'portada');return toast('Pasaporte creado'+(S.mkt?' · recibirás las novedades':''))}
  if(a==='enter')return go('directo');
  if(a==='ask'){var i=+el.dataset.i;S.pend=i;jump(['portada','quiz'],'pendiente');return toast('Solicitud enviada a '+OTHERS[i].adm)}
  if(a==='cancelReq'){S.pend=-1;return jump(['portada'],'quiz')}
  if(a==='okDemo'){var t=OTHERS[S.pend];S.user='equipo';setOn('swUser','equipo');S.myIdx=S.pend;S.newTeam=false;S.pend=-1;resetTeamState();
    if(t.hoy){jump(['portada','quiz'],'directo');return toast(t.adm+' te ha aceptado. Ya juegas con '+t.n)}
    jump(['portada','quiz'],'equipo');return toast(t.adm+' te ha aceptado en '+t.n)}
  if(a==='vote'){S.myVote=n;var best=S.cap;members().forEach(function(m){if(votesOf(m)>votesOf(best))best=m});var ch=best!==S.cap;S.cap=best;render();return toast(ch?best+' es ahora el capitán':'Voto para '+n)}
  if(a==='acc'){S.reqs=S.reqs.filter(function(x){return x!==n});S.extra=(S.extra||[]).concat([n]);render();return toast(n+' ya está en el equipo')}
  if(a==='rej'){S.reqs=S.reqs.filter(function(x){return x!==n});render();return toast('Solicitud rechazada')}
  if(a==='leave'){setUser('libre');jump(['portada'],'quiz');return toast('Has salido del equipo')}
  if(a==='rand'){var nm2=$('tName');if(nm2)S.draftName=nm2.value;S.esc.shape=Math.floor(Math.random()*4);S.esc.ic=ICONS[Math.floor(Math.random()*ICONS.length)];S.esc.c1=COLS[Math.floor(Math.random()*COLS.length)];do{S.esc.c2=COLS[Math.floor(Math.random()*COLS.length)]}while(S.esc.c2===S.esc.c1);render();return}
  if(a==='saveEsc'){var nv=($('tName').value||'').trim();if(!nv)return toast('Pon el nombre del equipo');
    var taken=OTHERS.filter(function(t){return t.n.toLowerCase()===nv.toLowerCase()})[0];
    if(taken&&myTeam()!==MYT){S.stack=['portada','quiz'];S.screen='elegir';render();return toast('«'+taken.n+'» ya existe'+(taken.hoy?' y está jugando hoy':'')+'. Pide entrar.')}
    S.esc.name=nv;if(myTeam()===MYT){go('__back');return toast('Escudo guardado')}
    S.user='equipo';setOn('swUser','equipo');S.myIdx=-1;S.newTeam=true;S.pend=-1;MYT.j=[0,0,0,0];MYT.pts=0;resetTeamState();
    jump(['portada','quiz'],S.day?'directo':'equipo');return toast('Equipo creado. Eres el administrador y el capitán.')}
  if(a==='answer'){S.q.ans=el.dataset.l;clearInterval(tick);render();return toast('Respuesta '+S.q.ans+' enviada')}
  if(a==='nextQ'){S.q={n:Math.min(S.q.n+1,10),left:LIGA.seg,ans:null,out:0,lost:false};render();return}
  if(a==='tglPreg'){S.verPreg=!S.verPreg;render();return toast(S.verPreg?'Los equipos ya ven las preguntas cerradas':'Preguntas ocultas para el equipo')}
  if(a==='addDate'){var d=$('nd').value,h=$('nh').value,ar=+$('na').value||12;if(!d)return toast('Elige una fecha');var p=d.split('-'),mm=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    DATES.push({d:+p[2],m:mm[+p[1]-1],w:'Jueves',h:h,j:DATES[DATES.length-1].j+1,aforo:ar,ins:0});render();return toast('Jornada añadida')}
  if(a==='saveRes'){tonight().forEach(function(t,i){var v=$('pts_'+i);if(v)t.pts=+v.value||0});S.view='cli';setOn('swView','cli');S.tab='noche';S.stack=['portada','quiz'];S.screen='liga';render();window.scrollTo(0,0);return toast('Publicado. Así lo ven los clientes.')}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches('[role=button]'))e.target.click()});
resetTeamState();render();
</script>
